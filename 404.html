<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  overflow-x: hidden;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #111827;
  color: #f9fafb;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
  overflow: hidden;
}

body::before {
  content: '';
  position: absolute;
  top: -40%;
  left: 50%;
  transform: translateX(-50%);
  width: min(800px, 100vw);
  height: min(800px, 100vw);
  background: radial-gradient(ellipse, rgba(59,130,246,0.06) 0%, transparent 70%);
  pointer-events: none;
}

.container {
  text-align: center;
  position: relative;
  z-index: 1;
  max-width: 560px;
}

.error-code {
  font-size: clamp(100px, 20vw, 180px);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.04em;
  background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 40%, #10b981 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 16px;
  position: relative;
}

.error-code::after {
  content: '404';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 40%, #10b981 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: blur(40px);
  opacity: 0.3;
  pointer-events: none;
}

h1 {
  font-size: clamp(1.25rem, 3vw, 1.75rem);
  font-weight: 700;
  color: #f1f5f9;
  margin-bottom: 12px;
  letter-spacing: -0.02em; padding-right: 0.05em;
}

p {
  font-size: 0.95rem;
  color: rgba(255,255,255,0.5);
  line-height: 1.7;
  margin-bottom: 40px;
}

.actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 28px;
  border-radius: 999px;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-decoration: none;
  cursor: pointer;
  border: none;
  position: relative;
  overflow: hidden;
  white-space: nowrap;
  transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease, filter 0.2s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}

.btn svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}

.btn-primary {
  background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
  color: #fff;
  box-shadow: 0 4px 20px rgba(59,130,246,0.4), 0 0 0 1px rgba(59,130,246,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: -1px;
  left: 15%;
  right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
}

.btn-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  transform: translateX(-100%);
  transition: transform 0.4s ease;
}

.btn-primary:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 8px 32px rgba(59,130,246,0.55), 0 0 0 1px rgba(59,130,246,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
  filter: brightness(1.06);
  color: #fff;
}

.btn-primary:hover::after {
  transform: translateX(100%);
}

.btn-secondary {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.65);
  font-weight: 500;
  letter-spacing: 0.01em;
  padding: 13px 22px;
}

.btn-secondary:hover {
  border-color: rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.09);
  color: rgba(255,255,255,0.95);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}

.links {
  margin-top: 56px;
  padding-top: 32px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.links span {
  display: block;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.3);
  margin-bottom: 16px;
  font-weight: 500;
}

.links nav {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

.links a {
  font-size: 0.84rem;
  color: rgba(255,255,255,0.45);
  text-decoration: none;
  transition: color 0.2s ease;
}

.links a:hover {
  color: #60a5fa;
}

@media (max-width: 768px) {
  body {
    padding: 40px 20px;
    justify-content: center;
    overflow-x: hidden;
    overflow-y: auto;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .container {
    max-width: 100%;
    width: 100%;
  }

  .error-code {
    font-size: clamp(72px, 18vw, 96px);
    margin-bottom: 12px;
  }

  .error-code::after {
    filter: blur(28px);
    opacity: 0.25;
  }

  h1 {
    font-size: 1.2rem;
    margin-bottom: 10px;
  }

  p {
    font-size: 0.875rem;
    line-height: 1.6;
    margin-bottom: 28px;
    padding: 0 4px;
  }

  .actions {
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
  }

  .btn {
    justify-content: center;
    padding: 14px 24px;
    font-size: 0.9rem;
    width: 100%;
    min-height: 50px;
  }

  .btn-primary:hover,
  .btn-secondary:hover {
    transform: none;
    filter: none;
  }

  .btn-primary:hover::after {
    transform: translateX(-100%);
  }

  .btn-primary:active {
    transform: scale(0.97);
    box-shadow: 0 2px 10px rgba(59,130,246,0.2);
  }

  .btn-secondary:active {
    background: rgba(255,255,255,0.1);
    transform: scale(0.97);
  }

  .links {
    margin-top: 36px;
    padding-top: 24px;
  }

  .links span {
    font-size: 0.65rem;
    margin-bottom: 12px;
  }

  .links nav {
    gap: 8px 16px;
  }

  .links a {
    font-size: 0.82rem;
    padding: 6px 4px;
  }
}

@media (max-width: 380px) {
  body {
    padding: 32px 16px;
  }

  .error-code {
    font-size: clamp(64px, 16vw, 72px);
  }

  h1 {
    font-size: 1.05rem;
  }

  p {
    font-size: 0.8rem;
    margin-bottom: 24px;
  }

  .actions {
    max-width: 280px;
  }

  .btn {
    padding: 12px 18px;
    font-size: 0.85rem;
    min-height: 46px;
  }

  .links nav {
    gap: 6px 12px;
  }

  .links a {
    font-size: 0.78rem;
  }
}
  .win-brand{background:linear-gradient(135deg,#60a5fa 0%,#93c5fd 50%,#3b82f6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-style:italic;font-weight:900; padding: 0.05em 0.1em;}
</style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist, has been moved, or is temporarily unavailable.</p>
    <div class="actions">
      <a href="./" class="btn btn-primary">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Go Home
      </a>
    </div>
    <div class="links">
      <span>Popular pages</span>
      <nav>
        <a href="bonuses">Bonuses</a>
        <a href="games">Games</a>
        <a href="payments">Payments</a>
        <a href="mobile">APK</a>
        <a href="safety">Safety</a>
      </nav>
    </div>
  </div>
  <script src="./js/chat-widget-loader.js?v=9" defer></script>
</body>
</html>
